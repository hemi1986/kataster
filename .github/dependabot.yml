version: 2

updates:
  - package-ecosystem: npm
    directory: /.claude
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tooling:
        patterns:
          - typescript
          - "@types/node"
    ignore:
      # Node typings follow the oldest runtime we support (engines: >=22.18), not the newest release –
      # newer typings would type-check APIs that do not exist on Node 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
