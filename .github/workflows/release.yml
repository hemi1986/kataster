name: release

on:
  push:
    tags: ["v*"]

permissions:
  # write: the job creates the GitHub release for the tag after publishing.
  contents: write
  # OIDC: npm exchanges this for a short-lived publish token. No npm token in the repository.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # Before publishing: the GitHub release needs the version's CHANGELOG section.
      - name: Extract the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## " v " ") == 1 || $0 == "## " v {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md \
            | sed '/./,$!d' > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::CHANGELOG.md has no section '## $version' – add it before tagging"
            exit 1
          fi

      - run: npm install --prefix .claude --no-audit --no-fund
      - run: npm run typecheck --prefix .claude
      - run: npm test

      # Trusted publishing: the npm CLI detects the OIDC environment and authenticates itself.
      # Provenance is generated automatically for a public package from a public repository.
      # `prepublishOnly` runs the suite a second time – a red suite cannot be published.
      - run: npm publish

      # The GitHub release mirrors the npm version: same tag, notes from the CHANGELOG section extracted above.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists – leaving it as it is."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Kataster ${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          fi
